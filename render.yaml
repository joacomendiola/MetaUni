databases:
  - name: metauni-db
    plan: free
    databaseName: metauni
    user: metauni

services:
  - type: web
    name: metauni-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run db:generate && npm run build -w @metauni/api
    startCommand: npx prisma migrate deploy --schema backend/prisma/schema.prisma && npm run start -w @metauni/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: metauni-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: 30
      - key: CORS_ORIGIN
        value: https://metauni-web.onrender.com

  - type: web
    name: metauni-web
    runtime: static
    buildCommand: npm ci --include=dev && npm run build -w @metauni/web
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://metauni-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
